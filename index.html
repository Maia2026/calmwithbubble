<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#8b3fb5">
<title>Bubble — Adelyn's App</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="phone">
  <div class="syncdot" id="syncdot" title="sync status"></div>
  <div class="screen" id="screen"></div>
  <div class="appfoot" id="appfoot">
    <span class="copy">© 2026 Brave Kids United, Inc. · Bubble is part of the Brave Battle™ platform.</span>
    <a href="#" class="helplink" onclick="showCrisisHelp(event)">Help</a>
  </div>
</div>

<script src="sync.js"></script>
<script src="app.js"></script>
<script>
  /* register service worker (Lesson 16) */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW reg failed', e));
    });
  }
</script>
</body>
</html>
